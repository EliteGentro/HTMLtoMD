<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Convert HTML to Markdown instantly. Free, fast, and runs entirely in your browser." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <meta name="theme-color" content="#16a34a" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>HTMLtoMD — Convert HTML to Markdown</title>
    <script>
      // Apply theme before first paint to avoid a light-mode flash (key matches src/hooks/useTheme.ts)
      (function () {
        var stored = null;
        try { stored = JSON.parse(localStorage.getItem('htmltomd:theme')); } catch (e) {}
        var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
